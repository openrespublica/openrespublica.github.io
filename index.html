<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunao Secure Verify</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        .logo { font-size: 3rem; margin-bottom: 1rem; }
        h2 { color: #1e293b; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #1d4ed8; }
        #result-box { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; display: none; word-break: break-all; font-family: monospace; font-size: 0.85rem; }
        .match { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛡️</div>
        <h2>Bunao Verifier</h2>
        
        <label style="font-size: 0.8rem; color: #64748b;">CONTROL NUMBER (AUTO-FILLED)</label>
        <input type="text" id="control" placeholder="BUNAO-XXXX" readonly>
        
        <label style="font-size: 0.8rem; color: #64748b;">ENTER RESIDENT NAME</label>
        <input type="text" id="name" placeholder="Full Name (AS PRINTED)" oninput="this.value = this.value.toUpperCase()">
        
        <button onclick="verify()">VERIFY AUTHENTICITY</button>
        
        <div id="result-box"></div>
    </div>

    <script>
        // 1. Auto-fill Control No from URL (?id=BUNAO-XXX)
        const params = new URLSearchParams(window.location.search);
        if(params.has('id')) {
            document.getElementById('control').value = params.get('id');
        }

        function verify() {
            const name = document.getElementById('name').value.trim();
            const control = document.getElementById('control').value.trim();
            const salt = "BUNAO_INTEGRITY_2026_PRO";
            
            if(!name || !control) return;

            const rawString = `${name}|${control}|${salt}`;
            const hash = CryptoJS.SHA256(rawString).toString();

            const resultBox = document.getElementById('result-box');
            resultBox.style.display = "block";
            resultBox.className = "match";
            resultBox.innerHTML = `<strong>GENERATED HASH:</strong><br>${hash}<br><br><small>Compare this to the hash on the certificate.</small>`;
        }
    </script>
</body>
</html>
